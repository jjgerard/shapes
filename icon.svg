<svg viewBox="0 0 660 610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fc1f0"/>
      <stop offset="100%" stop-color="#0d84b8"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1453b"/>
      <stop offset="100%" stop-color="#c11812"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbd45a"/>
      <stop offset="100%" stop-color="#e0a518"/>
    </linearGradient>
    <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- blue rounded square, back-left -->
  <g filter="url(#dropShadow)" transform="rotate(-3 175 180)">
    <rect x="10" y="15" width="330" height="330" rx="55" ry="55" fill="url(#blueGrad)" stroke="rgba(0,0,0,0.18)" stroke-width="3"/>
    <circle cx="140" cy="150" r="15" fill="#1c2a28"/>
    <circle cx="220" cy="150" r="15" fill="#1c2a28"/>
    <path d="M 128 192 Q 175 228 222 192" stroke="#1c2a28" stroke-width="13" fill="none" stroke-linecap="round"/>
  </g>

  <!-- red circle, back-right -->
  <g filter="url(#dropShadow)">
    <circle cx="490" cy="165" r="170" fill="url(#redGrad)" stroke="rgba(0,0,0,0.18)" stroke-width="3"/>
    <circle cx="450" cy="150" r="15" fill="#1c2a28"/>
    <circle cx="530" cy="150" r="15" fill="#1c2a28"/>
    <path d="M 438 192 Q 490 232 542 192" stroke="#1c2a28" stroke-width="13" fill="none" stroke-linecap="round"/>
  </g>

  <!-- yellow star, front and center -->
  <g filter="url(#dropShadow)" transform="rotate(-12 290 385)">
    <polygon points="290,180 337.02,320.28 485.0,321.65 366.09,409.72 410.5,550.85 290,465 169.5,550.85 213.91,409.72 95.0,321.65 242.98,320.28"
      fill="url(#goldGrad)" stroke="#b9860c" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="255" cy="368" r="15" fill="#1c2a28"/>
    <circle cx="330" cy="368" r="15" fill="#1c2a28"/>
    <path d="M 245 410 Q 292 448 340 410" stroke="#1c2a28" stroke-width="13" fill="none" stroke-linecap="round"/>
  </g>
</svg>

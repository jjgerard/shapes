<text x="960" y="150" font-size="14" fill="#333">Left, middle and right arms hang from hinges on the bottom of the body.</text>
<text x="960" y="174" font-size="14" fill="#333">Each hinge clicks at five angles: straight down, 25° and 50° either way.</text>
<text x="960" y="198" font-size="14" fill="#333">Body 54 × 26 mm (two-arm pieces 38 mm, one-arm pieces 30 mm).</text>
<text x="960" y="222" font-size="14" fill="#333">Dashed lines and rings: every position an arm can click into.</text>
<text x="960" y="246" font-size="14" fill="#333">Unused arms have to stow out of the way: the plug is wider than</text>
<text x="960" y="270" font-size="14" fill="#333">the hinge pitch, so a dangling arm would hit its neighbour.</text>
